name: Work share cross steps

on: workflow_dispatch

jobs:
  cross-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Confere versao
        run: cat /etc/os-release

      - name: Exibir mensagem
        run: echo "Primeira mensagem" > mensagem.txt

      - name: Qualquer outra coisa
        run: pwd

      - name: Le o conteudo do arquivo
        run: cat mensagem.txt
